<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Salimos? ✨</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #ff4b2b;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="date"],
    input[type="time"],
    select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus, select:focus {
      border-color: #ff4b2b;
    }
    button {
      width: 100%;
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>¿Aceptas una salida conmigo? 🌹</h1>
    <p>Elige el día, la hora y el plan que más te guste para organizarlo todo.</p>

    
   <form action="https://formspree.io/f/xwlpyayr" method="POST"
      
      <div class="form-group">
        <label for="fecha">📅 Elige la fecha:</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <div class="form-group">
        <label for="hora">⏰ Elige la hora:</label>
        <input type="time" id="hora" name="hora" required>
      </div>

      <div class="form-group">
        <label for="plan">✨ ¿Qué tipo de cita prefieres?</label>
        <select id="plan" name="plan" required>
          <option value="" disabled selected>Selecciona una opción...</option>
          <option value="Café y charla tranquila">☕ Un café y platicar a gusto</option>
          <option value="Cena romántica">🍽️ Una buena cena</option>
          <option value="Cine y palomitas">🍿 Cine y palomitas</option>
          <option value="Plan sorpresa">🎁 ¡Sorpréndeme!</option>
          <option value="Caminata / Al aire libre">🌿 Salir a caminar o al aire libre</option>
        </select>
      </div>

      <button type="submit">¡Confirmar Cita! ✨</button>
    </form>
  </div>

</body>
</html>
